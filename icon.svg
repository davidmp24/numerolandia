<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <linearGradient id="rainbowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4b4b"/>
      <stop offset="25%" stop-color="#ffb347"/>
      <stop offset="50%" stop-color="#ffeb3b"/>
      <stop offset="75%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2196f3"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Number Block Body (Red Block #1) -->
  <rect x="70" y="110" width="160" height="160" rx="28" fill="#FF4757" filter="url(#shadow)"/>
  <rect x="80" y="120" width="140" height="20" rx="10" fill="#FF6B81" opacity="0.6"/>
  <!-- Single Big Eye -->
  <circle cx="150" cy="180" r="32" fill="#FFFFFF"/>
  <circle cx="156" cy="180" r="16" fill="#2F3542"/>
  <circle cx="162" cy="174" r="6" fill="#FFFFFF"/>
  <!-- Smile -->
  <path d="M 130 220 Q 150 240 170 220" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- Number 1 badge -->
  <circle cx="100" cy="140" r="18" fill="#FFFFFF"/>
  <text x="100" y="147" font-family="Arial, sans-serif" font-weight="900" font-size="20" fill="#FF4757" text-anchor="middle">1</text>

  <!-- Number Block Body (Rainbow Block #7) -->
  <rect x="250" y="190" width="190" height="190" rx="32" fill="url(#rainbowGrad)" filter="url(#shadow)"/>
  <!-- Two Eyes -->
  <circle cx="310" cy="270" r="24" fill="#FFFFFF"/>
  <circle cx="314" cy="270" r="12" fill="#2F3542"/>
  <circle cx="318" cy="266" r="4" fill="#FFFFFF"/>

  <circle cx="380" cy="270" r="24" fill="#FFFFFF"/>
  <circle cx="384" cy="270" r="12" fill="#2F3542"/>
  <circle cx="388" cy="266" r="4" fill="#FFFFFF"/>
  <!-- Big Smile -->
  <path d="M 325 320 Q 345 350 365 320" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Number 7 badge -->
  <circle cx="405" cy="225" r="22" fill="#FFFFFF"/>
  <text x="405" y="234" font-family="Arial, sans-serif" font-weight="900" font-size="24" fill="#6C5CE7" text-anchor="middle">7</text>

  <!-- Sparkles -->
  <path d="M 235 90 L 243 110 L 263 118 L 243 126 L 235 146 L 227 126 L 207 118 L 227 110 Z" fill="#FFEAA7"/>
  <path d="M 450 150 L 455 165 L 470 170 L 455 175 L 450 190 L 445 175 L 430 170 L 445 165 Z" fill="#FFF"/>

  <!-- App Title Bottom Banner -->
  <rect x="60" y="415" width="392" height="65" rx="32.5" fill="#FFFFFF" filter="url(#shadow)"/>
  <text x="256" y="458" font-family="'Comic Sans MS', 'Arial Rounded MT Bold', sans-serif" font-weight="900" font-size="30" fill="#2E86DE" text-anchor="middle">NUMEROLÂNDIA</text>
</svg>
